[project]
name = "robust_koopman_cbf_rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.1",
    "gymnasium>=0.29",
    "pyyaml>=6.0",
    "qpsolvers[osqp]>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
safety = ["safety-gymnasium>=1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["robust_koopman_cbf_rl*"]
