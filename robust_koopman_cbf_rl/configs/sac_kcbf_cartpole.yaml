# KCBF-SAC for safe-control-gym CartPole.
# Base SAC params identical to sac_cartpole.yaml for fair same-budget comparison.
# KCBF-specific additions: lam_h (actor CBF penalty), eta (CBF decay), lam_slack (QP).
#
# eta=0.5: CBF decay per step at 15 Hz. h(t+1) >= 0.5*h(t) + rho.
# lam_slack=1000: high penalty keeps QP solutions near the CBF boundary.
total_steps: 500000
warmup_steps: 1000
batch_size: 512
buffer_capacity: 1000000
gamma: 0.98
tau: 0.12
lr: 4.52e-4
actor_lr: 4.52e-4
critic_lr: 2.25e-2
alpha: 0.2
lam_h: 1.0
eta: 0.5
lam_slack: 1000.0
