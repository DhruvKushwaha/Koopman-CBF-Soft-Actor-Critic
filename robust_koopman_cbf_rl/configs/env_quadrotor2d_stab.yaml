kind: safe_control_gym
env_id: quadrotor
task_config:
  quad_type: 2
  task: stabilization
  ctrl_freq: 50
  pyb_freq: 1000        # 20 physics steps per control step — required for drone stability
  physics: pyb
  normalized_rl_action_space: True   # action in [-1,1]; avoids actor/critic scale mismatch
  episode_len_sec: 5
  cost: rl_reward
  obs_goal_horizon: 0
  randomized_init: True
  randomized_inertial_prop: False
  done_on_out_of_bound: True
  done_on_violation: False

  # Reward shaping — matches SCG examples/rl/quadrotor_2D stab config.
  # Equal weighting across state dims; exponential reward keeps h bounded in [0,1].
  rew_state_weight: [1, 1, 1, 1, 1, 1]
  rew_act_weight: 0.1
  rew_exponential: True

  task_info:
    stabilization_goal: [0, 1]
    stabilization_goal_tolerance: 0.0

  inertial_prop:
    M: 0.027
    Iyy: 1.4e-05

  init_state_randomization_info:
    init_x:
      distrib: uniform
      low: -2.0
      high: 2.0
    init_x_dot:
      distrib: uniform
      low: -1.0
      high: 1.0
    init_z:
      distrib: uniform
      low: 0.3
      high: 2.0
    init_z_dot:
      distrib: uniform
      low: -1.0
      high: 1.0
    init_theta:
      distrib: uniform
      low: -0.2
      high: 0.2
    init_theta_dot:
      distrib: uniform
      low: -1.5
      high: 1.5

  # State: [x, x_dot, z, z_dot, theta, theta_dot]
  # CBF barriers (Quadrotor2DAltitudeBarrier z_min=0.2, z_max=1.8) sit strictly inside z bounds.
  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
      upper_bounds: [2.0, 1.0, 2.0, 1.0, 0.2, 1.5]
      lower_bounds: [-2.0, -1.0, 0.0, -1.0, -0.2, -1.5]
    - constraint_form: default_constraint
      constrained_variable: input
      upper_bounds: [0.29, 0.29]
      lower_bounds: [0.06, 0.06]

seed: 0

barrier:
  class: Quadrotor2DCompositeAltitudeBarrier
  z_min: 0.2
  z_max: 1.8
  alpha: 1.0   # weight on (z - z_min): altitude deficit
  beta: 0.5    # weight on z_dot: dampens fast descent near the floor
