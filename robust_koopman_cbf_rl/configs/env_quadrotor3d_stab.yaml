kind: safe_control_gym
env_id: quadrotor
task_config:
  quad_type: 3
  task: stabilization
  ctrl_freq: 50
  pyb_freq: 1000
  physics: pyb
  normalized_rl_action_space: True
  episode_len_sec: 6
  cost: rl_reward
  obs_goal_horizon: 0
  randomized_init: True
  randomized_inertial_prop: False
  done_on_out_of_bound: True
  done_on_violation: False

  task_info:
    stabilization_goal: [0, 0, 1]
    stabilization_goal_tolerance: 0.0

  inertial_prop:
    M: 0.027
    Ixx: 1.4e-05
    Iyy: 1.4e-05
    Izz: 2.17e-05

  init_state_randomization_info:
    init_x:
      distrib: uniform
      low: -1.0
      high: 1.0
    init_x_dot:
      distrib: uniform
      low: -0.5
      high: 0.5
    init_y:
      distrib: uniform
      low: -1.0
      high: 1.0
    init_y_dot:
      distrib: uniform
      low: -0.5
      high: 0.5
    init_z:
      distrib: uniform
      low: 0.5
      high: 1.5
    init_z_dot:
      distrib: uniform
      low: -0.5
      high: 0.5
    init_phi:
      distrib: uniform
      low: -0.1
      high: 0.1
    init_theta:
      distrib: uniform
      low: -0.1
      high: 0.1
    init_psi:
      distrib: uniform
      low: -0.1
      high: 0.1
    init_p:
      distrib: uniform
      low: -0.5
      high: 0.5
    init_q:
      distrib: uniform
      low: -0.5
      high: 0.5
    init_r:
      distrib: uniform
      low: -0.5
      high: 0.5

  # State: [x, x_dot, y, y_dot, z, z_dot, phi, theta, psi, p, q, r]
  # Input: 4 motor thrusts; constraints from SCG reference (quadrotor_3D_stab.yaml).
  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
      upper_bounds: [2.0, 1.0, 2.0, 1.0, 2.0, 1.0, 0.2, 0.2, 0.2, 1.0, 1.0, 1.0]
      lower_bounds: [-2.0, -1.0, -2.0, -1.0, 0.0, -1.0, -0.2, -0.2, -0.2, -1.0, -1.0, -1.0]
    - constraint_form: default_constraint
      constrained_variable: input
      upper_bounds: [0.148, 0.148, 0.148, 0.148]
      lower_bounds: [0.029, 0.029, 0.029, 0.029]

seed: 0

barrier:
  class: Quadrotor3DPositionBarrier
  # z is index 4 in 12D state [x, xd, y, yd, z, zd, phi, theta, psi, p, q, r]
  axis_index: 4
  lo: 0.2
  hi: 1.8
  side: lower
